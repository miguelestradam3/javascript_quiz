<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz App</title>
  <!-- Bootstrap CSS first -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" integrity="sha384-AYmEC3Yw5cVb3ZcuHtOA93w35dYTsvhLPVnYs9eStHfGJvOvKxVfELGroGkvsg+p" crossorigin="anonymous"/>
  <!-- Custom High-Contrast Stylesheets loaded after -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- Animated background particles -->
  <div class="particles" id="particles"></div>

  <section class="hero-section">
    <div class="container">
      <div class="row align-items-center">

        <!-- Left column — text content -->
        <div class="col-lg-6 hero-content">
          <div class="hero-badge">
            <span class="dot"></span>
            <span>Miguel Estrada</span>
          </div>

          <h1 class="hero-title">
            JavaScript<br>
            <span class="gradient-text">Online Quiz</span>
          </h1>

          <p class="hero-description">
            Test your knowledge with this interactive quiz built in Vanilla JavaScript.
            Challenge yourself and climb the leaderboard!
          </p>

          <div class="hero-buttons">
            <a href="play.html" class="btn-quiz btn-primary-quiz">
              <i class="fas fa-play"></i> Play Now
            </a>
            <a href="achievers.html" class="btn-quiz btn-outline-quiz">
              <i class="fas fa-trophy"></i> Leaderboard
            </a>
          </div>

          <div class="hero-stats">
            <div class="hero-stat-item">
              <h3>10</h3>
              <p>Questions</p>
            </div>
            <div class="hero-stat-item">
              <h3>6</h3>
              <p>Choices Each</p>
            </div>
            <div class="hero-stat-item">
              <h3>∞</h3>
              <p>Retries</p>
            </div>
          </div>
        </div>

        <!-- Right column — image -->
        <div class="col-lg-6 hero-visual">
          <div class="hero-image-wrapper">
            <img src="assets/img/logo.png" alt="Quiz Logo">
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="assets/bootstrap/bootstrap.bundle.min.js"></script>
  <script>
    // Generate particle dots
    (function() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 30; i++) {
        const dot = document.createElement('div');
        dot.classList.add('dot');
        dot.style.left = Math.random() * 100 + '%';
        dot.style.top = Math.random() * 100 + '%';
        dot.style.setProperty('--duration', (3 + Math.random() * 4) + 's');
        dot.style.setProperty('--delay', (Math.random() * 5) + 's');
        container.appendChild(dot);
      }
    })();
  </script>
</body>
</html>
