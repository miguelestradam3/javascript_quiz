<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard — Quiz</title>
  <!-- Bootstrap CSS first -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <!-- Custom High-Contrast Stylesheets loaded after -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- Animated background particles -->
  <div class="particles" id="particles"></div>

  <section class="leaderboard-page">
    <div class="leaderboard-container">
      <div class="glass-card leaderboard-card">

        <div class="leaderboard-icon">🏆</div>
        <h1 class="leaderboard-title">Leaderboard</h1>

        <ul id="scoresList" class="leaderboard-list"></ul>

        <a href="index.html" class="btn-quiz btn-outline-quiz" style="width:100%;">
          ← Back Home
        </a>

      </div>
    </div>
  </section>

  <script src="assets/js/achievers.js"></script>
  <script src="assets/bootstrap/bootstrap.bundle.min.js"></script>
  <script>
    // Particles
    (function() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 20; i++) {
        const dot = document.createElement('div');
        dot.classList.add('dot');
        dot.style.left = Math.random() * 100 + '%';
        dot.style.top = Math.random() * 100 + '%';
        dot.style.setProperty('--duration', (3 + Math.random() * 4) + 's');
        dot.style.setProperty('--delay', (Math.random() * 5) + 's');
        container.appendChild(dot);
      }
    })();
  </script>
</body>
</html>
